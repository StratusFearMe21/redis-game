services:
  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
  redis-game:
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      LISTEN_ADDR: "[::]:3000"
      REDIS_URL: "redis://valkey?protocol=resp3"
    deploy:
      mode: replicated
      replicas: 1
